[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proofdiff"
dynamic = ["version"]
description = "Change-aware release assurance for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Mohammad Atashi"}]
keywords = ["ai-agents", "regression-testing", "release-engineering", "mcp", "llm-evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = [
  "pytest>=8",
  "coverage>=7",
  "ruff>=0.9",
  "mypy>=1.14",
  "build>=1.2",
  "twine>=6",
  "jsonschema>=4",
  "PyYAML>=6.0",
]

[project.scripts]
proofdiff = "proofdiff.cli.main:main"

[project.urls]
Homepage = "https://github.com/TensorScholar/proofdiff"
Repository = "https://github.com/TensorScholar/proofdiff"
Issues = "https://github.com/TensorScholar/proofdiff/issues"

[tool.setuptools.dynamic]
version = {attr = "proofdiff._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proofdiff = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["proofdiff"]
omit = ["src/proofdiff/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["proofdiff"]
