name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,yaml]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/proofdiff
      - run: coverage run --branch -m pytest -q
      - run: coverage report -m
      - run: python scripts/check_schemas.py
      - run: python benchmarks/phase8b/validate_corpus.py --require-freeze-ready
      - run: python benchmarks/phase8b/validate_gate_b.py --require-freeze-ready
      - run: python benchmarks/phase8b/validate_gate_d.py --require-freeze-ready
      - run: python benchmarks/phase8b/validate_gate_d1.py --require-freeze-ready
      - run: python scripts/check_architecture.py
      - run: python scripts/security_scan.py
      - name: Set canonical build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: python scripts/check_release.py

  security:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e . pip-audit
      - run: pip-audit
