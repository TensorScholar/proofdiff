name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,yaml]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/proofdiff
      - run: coverage run --branch -m pytest -q
      - run: coverage report -m
      - run: python scripts/check_schemas.py
      - run: python scripts/check_architecture.py
      - run: python scripts/security_scan.py
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_release.py
      - run: python scripts/generate_sbom.py
      - run: python scripts/smoke_install.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proofdiff-dist
          path: dist/*
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
