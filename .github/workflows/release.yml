name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Verify release tag originates from main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag must reference a commit reachable from origin/main."
            exit 1
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,yaml]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/proofdiff
      - run: coverage run --branch -m pytest -q
      - run: coverage report -m
      - run: python scripts/check_schemas.py
      - run: python scripts/check_architecture.py
      - run: python scripts/security_scan.py
      - name: Set canonical build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # check_release.py invokes the sole PEP 517 build, then validates,
      # checksums, smoke-tests, attests, and transfers that exact artifact set.
      - name: Run canonical release checks and build
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/check_release.py --tag "$RELEASE_TAG"
          else
            python scripts/check_release.py
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proofdiff-dist
          path: dist/*
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download validated release set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name proofdiff-dist \
            --dir dist
      - name: Verify validated release set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          assets=(
            "dist/proofdiff-${version}-py3-none-any.whl"
            "dist/proofdiff-${version}.tar.gz"
            "dist/SHA256SUMS"
            "dist/proofdiff-sbom.cdx.json"
          )
          expected="$(printf '%s\n' "${assets[@]#dist/}" | sort)"
          actual="$(find dist -maxdepth 1 -type f -print | sed 's#^dist/##' | sort)"
          test "$actual" = "$expected"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          assets=(
            "dist/proofdiff-${version}-py3-none-any.whl"
            "dist/proofdiff-${version}.tar.gz"
            "dist/SHA256SUMS"
            "dist/proofdiff-sbom.cdx.json"
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir existing-release
            for asset in "${assets[@]}"; do
              name="${asset#dist/}"
              if [ ! -f "existing-release/$name" ]; then
                echo "::error::Existing release is missing expected asset: $name"
                exit 1
              fi
              if ! cmp --silent "$asset" "existing-release/$name"; then
                echo "::error::Existing release asset differs from validated artifact: $name"
                exit 1
              fi
            done
          else
            release_options=(
              --repo "$GITHUB_REPOSITORY"
              --verify-tag
              --title "ProofDiff ${RELEASE_TAG}"
              --generate-notes
            )
            if [[ "$RELEASE_TAG" =~ rc[0-9]+$ ]]; then
              release_options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${release_options[@]}" "${assets[@]}"
          fi
      - name: Verify GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          expected=(
            "proofdiff-${version}-py3-none-any.whl"
            "proofdiff-${version}.tar.gz"
            "SHA256SUMS"
            "proofdiff-sbom.cdx.json"
          )
          expected_names="$(printf '%s\n' "${expected[@]}" | sort)"
          actual_names="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort)"
          test "$actual_names" = "$expected_names"
