name: External validation batch 1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/external-validation-batch1.yml"
      - "examples/external-validation-batch1/**"

permissions:
  contents: read

concurrency:
  group: external-validation-batch1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: openai-agents-chained-ref
            base_repo: openai/openai-agents-python
            candidate_repo: openai/openai-agents-python
            base_sha: de60d05b0c5af345c8a3893673196156a38a249a
            candidate_sha: f32f613a7f502af445405d7ef55aae75a276f835
            probe: openai_agents_probe.py
            env_kind: uv-root
            repair_exit: 1
            reverse_exit: 1
            full_exit: 1
          - case: copilotkit-subgraph-context
            base_repo: CopilotKit/CopilotKit
            candidate_repo: CopilotKit/CopilotKit
            base_sha: 3ff7a5160655e4fd1d59b541da1b83887d50307f
            candidate_sha: e9148b305025620e9f43c4eb3e597e5b9bcef419
            probe: copilotkit_probe.py
            env_kind: poetry-sdk
            repair_exit: 0
            reverse_exit: 1
            full_exit: 0
          - case: langgraph-interrupt-wrapper
            base_repo: langchain-ai/langgraph
            candidate_repo: devansh-dek/langgraph
            base_sha: 5931a5f0b313feff24e2516a586c55601b868ac1
            candidate_sha: 4680a4e94fb503ec321ca6c0a1b0af36db8dd9e1
            probe: langgraph_probe.py
            env_kind: uv-langgraph-overlay
            repair_exit: 0
            reverse_exit: 2
            full_exit: 0
    env:
      PILOT_ROOT: examples/external-validation-batch1
      OUT_ROOT: .proofdiff/pilots/external-validation-batch1
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      POETRY_NO_INTERACTION: "1"

    steps:
      - name: Checkout ProofDiff
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # setup-uv v9.0.0
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Install ProofDiff validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,yaml]'
          python -m pip install 'poetry==2.1.3'

      - name: Checkout frozen baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.base_repo }}
          ref: ${{ matrix.base_sha }}
          path: .pilot/base
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout frozen candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.candidate_repo }}
          ref: ${{ matrix.candidate_sha }}
          path: .pilot/candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Verify frozen target revisions
        shell: bash
        run: |
          test "$(git -C .pilot/base rev-parse HEAD)" = "${{ matrix.base_sha }}"
          test "$(git -C .pilot/candidate rev-parse HEAD)" = "${{ matrix.candidate_sha }}"

      - name: Install frozen target environments
        shell: bash
        run: |
          case "${{ matrix.env_kind }}" in
            uv-root)
              (cd .pilot/base && uv sync --frozen --no-dev)
              (cd .pilot/candidate && uv sync --frozen --no-dev)
              echo "BASE_PYTHON=$PWD/.pilot/base/.venv/bin/python" >> "$GITHUB_ENV"
              echo "CANDIDATE_PYTHON=$PWD/.pilot/candidate/.venv/bin/python" >> "$GITHUB_ENV"
              ;;
            poetry-sdk)
              (cd .pilot/base/sdk-python && poetry install --only main --no-interaction)
              (cd .pilot/candidate/sdk-python && poetry install --only main --no-interaction)
              echo "BASE_PYTHON=$PWD/.pilot/base/sdk-python/.venv/bin/python" >> "$GITHUB_ENV"
              echo "CANDIDATE_PYTHON=$PWD/.pilot/candidate/sdk-python/.venv/bin/python" >> "$GITHUB_ENV"
              ;;
            uv-langgraph-overlay)
              # Resolve the frozen main LangGraph runtime from each revision's committed lockfile.
              # The changed `prebuilt` package is then supplied directly from the same immutable
              # checkout via PYTHONPATH, avoiding dependency re-resolution while ensuring the
              # probe imports the exact baseline/candidate ToolNode implementation.
              (cd .pilot/base/libs/langgraph && uv sync --frozen --no-dev)
              (cd .pilot/candidate/libs/langgraph && uv sync --frozen --no-dev)
              BASE_PY="$PWD/.pilot/base/libs/langgraph/.venv/bin/python"
              CANDIDATE_PY="$PWD/.pilot/candidate/libs/langgraph/.venv/bin/python"
              BASE_OVERLAY="$PWD/.pilot/base/libs/prebuilt"
              CANDIDATE_OVERLAY="$PWD/.pilot/candidate/libs/prebuilt"
              PYTHONPATH="$BASE_OVERLAY" "$BASE_PY" -c 'import inspect; import langgraph.errors; import langgraph.prebuilt.tool_node as m; print(inspect.getfile(m))'
              PYTHONPATH="$CANDIDATE_OVERLAY" "$CANDIDATE_PY" -c 'import inspect; import langgraph.errors; import langgraph.prebuilt.tool_node as m; print(inspect.getfile(m))'
              echo "BASE_PYTHON=$BASE_PY" >> "$GITHUB_ENV"
              echo "CANDIDATE_PYTHON=$CANDIDATE_PY" >> "$GITHUB_ENV"
              echo "BASE_PYTHONPATH=$BASE_OVERLAY" >> "$GITHUB_ENV"
              echo "CANDIDATE_PYTHONPATH=$CANDIDATE_OVERLAY" >> "$GITHUB_ENV"
              ;;
            *)
              echo "unknown environment kind: ${{ matrix.env_kind }}" >&2
              exit 2
              ;;
          esac

      - name: Capture independent repeated behavior
        shell: bash
        run: |
          CASE_OUT="$OUT_ROOT/${{ matrix.case }}"
          mkdir -p "$CASE_OUT/raw"

          base_extra=()
          candidate_extra=()
          if [[ -n "${BASE_PYTHONPATH:-}" ]]; then
            base_extra+=(--pythonpath "$BASE_PYTHONPATH")
          fi
          if [[ -n "${CANDIDATE_PYTHONPATH:-}" ]]; then
            candidate_extra+=(--pythonpath "$CANDIDATE_PYTHONPATH")
          fi

          python "$PILOT_ROOT/capture.py" \
            --python "$BASE_PYTHON" \
            "${base_extra[@]}" \
            --probe "$PILOT_ROOT/${{ matrix.probe }}" \
            --revision "${{ matrix.base_sha }}" \
            --runs 3 \
            --output "$CASE_OUT/raw/base-capture.json"
          python "$PILOT_ROOT/capture.py" \
            --python "$CANDIDATE_PYTHON" \
            "${candidate_extra[@]}" \
            --probe "$PILOT_ROOT/${{ matrix.probe }}" \
            --revision "${{ matrix.candidate_sha }}" \
            --runs 3 \
            --output "$CASE_OUT/raw/candidate-capture.json"

      - name: Translate captures into ProofDiff inputs
        run: |
          CASE_OUT="$OUT_ROOT/${{ matrix.case }}"
          python "$PILOT_ROOT/prepare.py" \
            --case "${{ matrix.case }}" \
            --base-capture "$CASE_OUT/raw/base-capture.json" \
            --candidate-capture "$CASE_OUT/raw/candidate-capture.json" \
            --output "$CASE_OUT/input"
          python "$PILOT_ROOT/make_full_contracts.py" \
            --source "$PILOT_ROOT/contracts/${{ matrix.case }}" \
            --output "$CASE_OUT/full-contracts"

      - name: Run targeted repair
        shell: bash
        run: |
          CASE_OUT="$OUT_ROOT/${{ matrix.case }}"
          set +e
          proofdiff check \
            --baseline "$CASE_OUT/input/base-manifest.json" \
            --candidate "$CASE_OUT/input/candidate-manifest.json" \
            --contracts "$PILOT_ROOT/contracts/${{ matrix.case }}" \
            --baseline-traces "$CASE_OUT/input/base-traces.jsonl" \
            --candidate-traces "$CASE_OUT/input/candidate-traces.jsonl" \
            --policy "$PILOT_ROOT/policy.json" \
            --evidence "$CASE_OUT/evidence/repair"
          code=$?
          set -e
          test "$code" -eq "${{ matrix.repair_exit }}"
          proofdiff verify --evidence "$CASE_OUT/evidence/repair"

      - name: Run counterfactual regression
        shell: bash
        run: |
          CASE_OUT="$OUT_ROOT/${{ matrix.case }}"
          set +e
          proofdiff check \
            --baseline "$CASE_OUT/input/candidate-manifest.json" \
            --candidate "$CASE_OUT/input/base-manifest.json" \
            --contracts "$PILOT_ROOT/contracts/${{ matrix.case }}" \
            --baseline-traces "$CASE_OUT/input/candidate-traces.jsonl" \
            --candidate-traces "$CASE_OUT/input/base-traces.jsonl" \
            --policy "$PILOT_ROOT/policy.json" \
            --evidence "$CASE_OUT/evidence/regression"
          code=$?
          set -e
          test "$code" -eq "${{ matrix.reverse_exit }}"
          proofdiff verify --evidence "$CASE_OUT/evidence/regression"

      - name: Run full-suite baseline
        shell: bash
        run: |
          CASE_OUT="$OUT_ROOT/${{ matrix.case }}"
          set +e
          proofdiff check \
            --baseline "$CASE_OUT/input/base-manifest.json" \
            --candidate "$CASE_OUT/input/candidate-manifest.json" \
            --contracts "$CASE_OUT/full-contracts" \
            --baseline-traces "$CASE_OUT/input/base-traces.jsonl" \
            --candidate-traces "$CASE_OUT/input/candidate-traces.jsonl" \
            --policy "$PILOT_ROOT/policy.json" \
            --evidence "$CASE_OUT/evidence/full-suite"
          code=$?
          set -e
          test "$code" -eq "${{ matrix.full_exit }}"
          proofdiff verify --evidence "$CASE_OUT/evidence/full-suite"

      - name: Verify preregistered case outcome
        run: |
          CASE_OUT="$OUT_ROOT/${{ matrix.case }}"
          python "$PILOT_ROOT/verify.py" \
            --case "${{ matrix.case }}" \
            --base-capture "$CASE_OUT/raw/base-capture.json" \
            --candidate-capture "$CASE_OUT/raw/candidate-capture.json" \
            --repair-evidence "$CASE_OUT/evidence/repair" \
            --regression-evidence "$CASE_OUT/evidence/regression" \
            --full-evidence "$CASE_OUT/evidence/full-suite" \
            --results-out "$CASE_OUT/results.json"

      - name: Upload case evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proofdiff-external-batch1-${{ matrix.case }}-${{ github.run_id }}
          path: .proofdiff/pilots/external-validation-batch1/${{ matrix.case }}/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
